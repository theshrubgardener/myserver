name: postgres
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: backup-shared-postgres
    restart: unless-stopped
    ports:
      - "192.168.0.114:5400:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: postgres
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backup-shared-db-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt

volumes:
  postgres_data:

networks:
  backup-shared-db-net:
    external: true
    name: backup-shared-db-net